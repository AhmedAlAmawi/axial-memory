[package]
name = "axial-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Axial Memory desktop app"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
anyhow = "1.0.104"
axial-core = { path = "../core" }
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.2", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.2"
tokio = { version = "1.53.2", features = ["time"] }
uuid = { version = "1.28.0", features = ["v4"] }
