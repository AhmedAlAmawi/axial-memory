[package]
name = "axial-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Finds, reads and ranks Grasshopper definitions on a computer, read-only."

[lib]
name = "axial_core"
path = "src/lib.rs"

[[bin]]
name = "axial-scan"
path = "src/bin/axial-scan.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
csv = "1.4.0"
flate2 = "1.1.10"
os_info = "3.15.0"
regex = "1.13.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
whoami = "2.1.3"
zip = { version = "9.0.1", default-features = false, features = ["deflate", "deflate64"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3.27.0"
